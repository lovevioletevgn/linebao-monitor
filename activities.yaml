# ============================================================
# 羊毛活动清单（固定入口 + 固定开抢时间）
# ============================================================
# 为什么是这份清单，而不是"抓来的线报"？
#   真正的「1 分钱 / 免费」几乎全是平台官方活动，不是突发线报。
#   它们有固定入口、固定开抢时间，靠运气抽选或做任务获取。
#   —— 这类信息不需要"抓"，需要"准时被提醒"。
#
# 信息来源：公开攻略整理（2026）。具体活动以 APP 内实际为准。
# 时间字段用 24 小时制，脚本会在开抢前 N 分钟提醒你。
# ============================================================

settings:
  # 默认提前多少分钟提醒（每条活动的 remind_before 可单独覆盖）
  default_remind_before: 10

activities:
  - name: "天猫超市 · 一分钱试用"
    time: "10:00"
    remind_before: 15
    where: "天猫超市 APP → 我的 → 我的专属试用"
    note: "每天上午 10 点放 10 万件，每天限领 1 个，日用品/零食居多"

  - name: "天猫U先 · 上午场"
    time: "10:00"
    remind_before: 15
    where: "淘宝 APP 搜「天猫U先」→ 疯狂试用日"
    note: "限时秒杀通道，0.01 元包邮抢大牌小样"

  - name: "京东 · 0.01 元试用券补货"
    time: "10:00"
    remind_before: 15
    where: "京东 APP 搜「新人礼包」"
    note: "每日 10 点补货：纸巾 / 牙膏旅行装 / 手机支架（新人专享）"

  - name: "天猫U先 · 晚间场"
    time: "18:00"
    remind_before: 10
    where: "淘宝 APP 搜「天猫U先」→ 疯狂试用日"
    note: "晚间场，0.01 元包邮抢大牌小样"

  - name: "天猫U先 · 深夜场"
    time: "22:00"
    remind_before: 10
    where: "淘宝 APP 搜「天猫U先」→ 疯狂试用日"
    note: "深夜场，0.01 元包邮抢大牌小样"

  - name: "日常任务 · 攒能量/签到"
    time: "09:00"
    remind_before: 0
    where: "什么值得买「全民众测」/ 美团果园 / 京东健康打卡"
    note: "都是'用时间换商品'：众测攒能量值换必中券；美团果园签 7 天 0.01 元拿抽纸；京东健康打卡 21 天 0 元拿小家电"
